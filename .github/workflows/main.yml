
name: docker-level1-build

on:
  push:
    branches: ["main"]

permissions: 
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --no-restore
      
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set image tags
        run: | 
          echo "IMAGE=ghcr.io/andrey666berkov/helloapi" >> $GITHUB_ENV
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

          
      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .
          push: true
          tags: | 
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
         cache-from: type=gha
         cache-to: type=gha,mode=max     

    
