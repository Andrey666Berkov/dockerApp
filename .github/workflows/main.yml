
name: docker-level1-build

on:
  push:
    branches: ["main"]

permissions: 
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: | 
          echo "IMAGE=ghcr.io/andrey666berkov/helloapi" >> $GITHUB_ENV
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

          
      - name: Login ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .

      - name: Push image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG
