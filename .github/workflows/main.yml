
name: docker-level1-build

on:
  push:
    branches: ["main"]
  workflow_dispatch:



jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --no-restore
      
  docker:
    runs-on: ubuntu-latest
    needs: test
    
    permissions: 
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set image tags
        run: | 
          echo "IMAGE=ghcr.io/andrey666berkov/helloapi" >> $GITHUB_ENV
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

          
      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: | 
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max    
   
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy with ssh
        uses: appleboy/ssh-action@v4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd /opt/helloapi
            docker compose pull
            docker compose up -d
            docker ps 
            echo "------curl cjeck---------"
            curl -i http://127.0.0.1:8081/ | head -n 20
          
          
    
   
          

    
